<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数値解析 語句クイズ</title>
  <style>
    .answer-toggle {
      display: none;
    }

    .answer {
      cursor: pointer;
      filter: blur(0.4rem);
    }

    .answer-toggle:checked + .answer {
      filter: none;
    }
  </style>
</head>
<body>
  <h3>第1週 数値解析</h3>
  <ul id="word-list"></ul>
  <script>
    const words = [
      { question: "絶対誤差", answer: "absolute error"},
      { question: "相対誤差", answer: "relative error"},
    ];

    const list = document.querySelector("#word-list");

    words.forEach(({ question, answer }) => {
      list.innerHTML += `
        <li>
          ${question} :
          <label>
            <input class="answer-toggle" type="checkbox">
            <span class="answer">${answer}</span>
          </label>
        </li>
      `;
    });
  </script>
</body>
</html>
